<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vimeo Video</title>
    <style>
        body {
            background-color: #363c42; /* Further adjusted dark blue-grey from the image */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide scrollbars if content overflows */
        }
        html {
            margin: 0;
            padding: 0;
        }
        .video-container {
            padding: 56.25% 0 0 0;
            position: relative;
            margin: 0; /* Ensure no margin around the video container */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe src="https://player.vimeo.com/video/1119899297?badge=0&autopause=0&player_id=0&app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="studietid"></iframe>
    </div>
    <script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
